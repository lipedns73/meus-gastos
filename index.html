<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Meus Gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--fundo:#0A0C0F;--cartao:#14181D;--cartao2:#1B2027;--linha:#262C35;--texto:#FFFFFF;--cinza:#98A2AE;
--destaque:#FF6B1A;--apoio:#FFC46B;--bom:#3DD68C;--alerta:#FFC46B;--ruim:#FF5C5C}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);font:15px/1.45 Inter,system-ui,sans-serif;padding:20px 16px 60px}
main{max-width:980px;margin:0 auto}
h1{font:400 38px/1 Anton,Impact,'Arial Narrow',sans-serif;text-transform:uppercase;margin:0;letter-spacing:.5px}
h2{font-size:15px;margin:0;font-weight:600}
h3{margin:28px 0 10px;font-size:16px}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--cartao2);border:1px solid var(--linha);border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--cinza)}
button.prim{background:var(--destaque);border-color:var(--destaque);color:#0A0C0F;font-weight:700}
button.perigo{color:var(--ruim);border-color:#4a2326}
select,input,textarea{background:var(--cartao2);border:1px solid var(--linha);border-radius:8px;padding:6px 8px;max-width:100%}
.cab{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sub{color:var(--cinza);margin:6px 0 18px}.total{color:var(--destaque);font-weight:700}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card,.caixa{background:var(--cartao);border-radius:12px;padding:16px}
.card{cursor:pointer;border:1px solid transparent}.card.sel{border-color:var(--destaque)}
.topo{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:12px;border:1px solid;border-radius:99px;padding:2px 8px;white-space:nowrap}
.num{font-size:26px;font-weight:700;margin:10px 0}.num small{font-size:14px;color:var(--cinza);font-weight:400}
.barra{position:relative;height:10px;background:var(--cartao2);border-radius:99px}.enche{height:100%;border-radius:99px}
.ritmo{position:absolute;top:-4px;width:2px;height:18px;background:var(--texto);opacity:.55}
.rodape{display:flex;justify-content:space-between;gap:8px;color:var(--cinza);font-size:13px;margin-top:10px;flex-wrap:wrap}.rodape b{color:var(--texto)}
.leg{color:var(--cinza);font-size:12px;margin:8px 0 0}
.info{display:flex;gap:8px;flex-wrap:wrap;margin:-8px 0 18px}
.info span{background:var(--cartao);border:1px solid var(--linha);border-radius:99px;padding:4px 12px;font-size:12px;color:var(--cinza)}
.info b{color:var(--texto);font-weight:600}
.info:empty{display:none}
.pend{border:1px solid var(--alerta);margin-top:18px}.pend h2{color:var(--alerta)}
.muted{color:var(--cinza);font-size:13px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border-radius:99px;padding:4px 12px;font-size:13px}.chip.on{background:var(--destaque);border-color:var(--destaque);color:#0A0C0F;font-weight:600}
.lista{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:52px 1fr auto 170px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--linha)}
.item .d{color:var(--cinza);font-size:13px}.item .n{overflow:hidden}.item .n div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .n small{color:var(--cinza);font-size:12px}.item .v{text-align:right;white-space:nowrap;font-weight:600}
.item select{width:100%}.item.semcat select{border-color:var(--alerta)}.item.fora .v,.item.fora .n div{color:var(--cinza);text-decoration:line-through}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 6px;border-bottom:1px solid var(--linha);text-align:left}
.vv{text-align:right;white-space:nowrap}.tab-scroll{overflow-x:auto}
.vazio{text-align:center;padding:40px 16px;color:var(--cinza)}
.vazio b{color:var(--texto);display:block;font-size:18px;margin-bottom:6px}
dialog{background:var(--cartao);color:var(--texto);border:1px solid var(--linha);border-radius:14px;width:min(720px,calc(100vw - 32px));max-height:calc(100vh - 40px);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.65)}
.aj h3:first-child{margin-top:0}
.linha-meta{display:grid;grid-template-columns:1fr 120px auto;gap:8px;margin-bottom:8px}
.linha-nome{display:grid;grid-template-columns:1fr 170px auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--linha)}
.aj textarea{width:100%;min-height:70px}.aj label{display:block;font-size:13px;color:var(--cinza);margin:10px 0 4px}
.aviso{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--cartao2);border:1px solid var(--destaque);padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100vw - 32px)}
.aviso.on{opacity:1}
.drop{outline:2px dashed var(--destaque);outline-offset:6px}
@media (max-width:640px){
  h1{font-size:30px}
  .item{grid-template-columns:44px 1fr auto;row-gap:6px}
  .item select{grid-column:1/-1}
  .linha-meta{grid-template-columns:1fr 90px auto}
  .linha-nome{grid-template-columns:1fr auto}.linha-nome select{grid-column:1/-1;grid-row:2}
}
</style>
</head>
<body>
<main id="app">
  <div class="cab">
    <h1 id="titulo">Meus gastos</h1>
    <div class="acoes">
      <select id="mes" aria-label="Mês"></select>
      <button class="prim" id="btnSubir">Subir extrato</button>
      <button id="btnAjustes">Ajustes</button>
      <input type="file" id="arquivo" accept=".csv,.ofx,.txt" multiple hidden>
    </div>
  </div>
  <p class="sub" id="resumo"></p>
  <div class="info" id="info"></div>
  <div id="corpo"></div>
</main>

<dialog id="dlg">
  <div class="aj" id="ajustes"></div>
  <div style="text-align:right;margin-top:16px"><button class="prim" id="fechar">Fechar</button></div>
</dialog>
<div class="aviso" id="aviso"></div>

<script>
"use strict";
const CHAVE = "meus-gastos.v1";
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const FORA = "fora";

const PADRAO = {
  metas: [
    {id:"mercado", nome:"Mercado avulso", limite:1000},
    {id:"comida_fora", nome:"Comida fora", limite:1000},
    {id:"farmacia", nome:"Farmácia", limite:500},
    {id:"outros", nome:"Outros gastos", limite:1000}
  ],
  palavras: {
    mercado: ["supermercado","mercado","mercadinho","minimercado","atacadao","atacadista","assai","carrefour","pao de acucar","hortifruti","hortifrut","sacolao","zaffari","condor","savegnago","guanabara","prezunic","sams club","makro","muffato","angeloni","st marche","hirota","sonda","super"],
    comida_fora: ["ifood","rappi","aiqfome","ze delivery","restaurante","lanchonete","lanches","padaria","panificadora","pizzaria","pizza","burger","hamburgueria","mcdonalds","mc donalds","burger king","subway","habibs","outback","starbucks","cafeteria","cafe","churrascaria","sushi","temakeria","acai","sorveteria","boteco","choperia","pastelaria","spoleto","giraffas","madero","coco bambu","kalzone","chinaexpressgreen","china express"],
    farmacia: ["farmacia","drogaria","droga","drogasil","raia","pague menos","panvel","pacheco","sao joao","drogao","nissei","araujo","venancio","extrafarma","ultrafarma","onofre"],
    outros: [],
    fora: ["aplicacao","resgate","rdb","caixinha","pagamento de fatura","pagamento fatura","transferencia entre contas","boleto","pagamento de titulo","pagto titulo","pagamento titulo","transferencia para conta poupanca","poupanca"]
  },
  nomes: {},     // "nome normalizado" -> categoria
  manual: {},    // id do lançamento -> categoria
  lanc: {},      // id -> {id,data,valor,desc}
  envios: [],    // {quando, arquivo, de, ate, novos}
  atualizado: null
};
let protegido = null;
async function protegerDados(){
  try{
    if(!navigator.storage || !navigator.storage.persist) { protegido = false; return; }
    protegido = await navigator.storage.persisted() || await navigator.storage.persist();
  }catch(e){ protegido = false; }
}

let E = carregar();
let filtro = "todos";
let mesAtual = null;

/* ---------- guardar ---------- */
function carregar(){
  try{
    const s = JSON.parse(localStorage.getItem(CHAVE) || "null");
    if(s && s.metas) return Object.assign(structuredClone(PADRAO), s);
  }catch(e){}
  return structuredClone(PADRAO);
}
function salvar(){
  E.atualizado = new Date().toISOString();
  try{ localStorage.setItem(CHAVE, JSON.stringify(E)); }
  catch(e){ aviso("Não consegui salvar neste navegador (modo anônimo?). Faça um backup em Ajustes."); }
}

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = t => String(t||"").normalize("NFKD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const brl = v => v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function hash(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);}
let tAviso; function aviso(msg){const a=$("#aviso");a.textContent=msg;a.classList.add("on");clearTimeout(tAviso);tAviso=setTimeout(()=>a.classList.remove("on"),3200);}
const fmtDia = iso => iso ? `${iso.slice(8,10)}/${iso.slice(5,7)}/${iso.slice(0,4)}` : "—";
function fmtQuando(iso){ if(!iso) return "—"; const d = new Date(iso);
  return d.toLocaleDateString("pt-BR") + " às " + d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }
function slug(t){return norm(t).replace(/ /g,"_")||("cat_"+Date.now());}

/* ---------- leitura de extrato ---------- */
function valorBR(s){
  s = String(s||"").trim().replace(/R\$|\s| /g,"");
  if(!s) return null;
  const neg = s.startsWith("-") || s.endsWith("-") || (s.startsWith("(") && s.endsWith(")"));
  s = s.replace(/^[-+(]+|[-)]+$/g,"");
  if(s.includes(",") && s.includes(".")) s = s.lastIndexOf(",") > s.lastIndexOf(".") ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,"");
  else if(s.includes(",")) s = s.replace(",",".");
  const v = parseFloat(s);
  return isNaN(v) ? null : (neg ? -v : v);
}
function dataBR(s){
  s = String(s||"").trim().split(" ")[0];
  let m;
  if((m = s.match(/^(\d{2})[\/-](\d{2})[\/-](\d{4})$/))) return `${m[3]}-${m[2]}-${m[1]}`;
  if((m = s.match(/^(\d{2})\/(\d{2})\/(\d{2})$/))) return `20${m[3]}-${m[2]}-${m[1]}`;
  if((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  if((m = s.match(/^(\d{4})(\d{2})(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}
function parseCSV(texto, d){
  const rows=[]; let row=[], cel="", q=false;
  for(let i=0;i<texto.length;i++){
    const c=texto[i];
    if(q){ if(c=='"'){ if(texto[i+1]=='"'){cel+='"';i++;} else q=false; } else cel+=c; }
    else if(c=='"') q=true;
    else if(c==d){ row.push(cel); cel=""; }
    else if(c=="\n" || c=="\r"){ if(c=="\r" && texto[i+1]=="\n") i++; row.push(cel); rows.push(row); row=[]; cel=""; }
    else cel+=c;
  }
  if(cel || row.length){ row.push(cel); rows.push(row); }
  return rows;
}
function lerCSV(texto){
  const amostra = texto.split(/\r?\n/).slice(0,30).join("\n");
  const d = [";",",","\t"].sort((a,b)=>amostra.split(b).length-amostra.split(a).length)[0];
  const rows = parseCSV(texto, d);
  let ini = rows.slice(0,40).findIndex(r => { const n=r.map(norm); return n.some(c=>c.startsWith("data")) && n.some(c=>c.includes("valor")); });
  if(ini < 0) return [];
  const cab = rows[ini].map(norm);
  const iData = cab.findIndex(c=>c.startsWith("data"));
  const iValor = cab.findIndex(c=>c.includes("valor"));
  const iId = cab.findIndex(c=>["identificador","id","codigo"].includes(c));
  const iDesc = cab.map((c,i)=>i).filter(i => i!==iData && i!==iValor && /descri|hist|memo|estabelec|lancamento|titulo/.test(cab[i]));
  const out=[];
  for(const r of rows.slice(ini+1)){
    if(r.length <= Math.max(iData,iValor)) continue;
    const data = dataBR(r[iData]), valor = valorBR(r[iValor]);
    if(!data || valor===null) continue;
    const desc = iDesc.map(i=>(r[i]||"").trim()).filter(Boolean).join(" - ").replace(/\s*[\r\n]+\s*/g," - ");
    out.push({data, valor, desc, fitid: iId>=0 ? (r[iId]||"").trim() : ""});
  }
  return out;
}
function lerOFX(texto){
  const out=[];
  const blocos = texto.split(/<STMTTRN>/i).slice(1);
  for(let b of blocos){
    b = b.split(/<\/STMTTRN>|<\/BANKTRANLIST>/i)[0];
    const f={}; for(const m of b.matchAll(/<(\w+)>([^<\r\n]*)/g)) f[m[1].toUpperCase()] = m[2].trim();
    const data = dataBR((f.DTPOSTED||"").slice(0,8)), valor = valorBR((f.TRNAMT||"").replace(",","."));
    const desc = [f.NAME,f.MEMO].filter(Boolean).join(" - ");
    if(data && valor!==null) out.push({data, valor, desc, fitid: f.FITID||""});
  }
  return out;
}
async function lerArquivo(file){
  const buf = await file.arrayBuffer();
  let texto = new TextDecoder("utf-8").decode(buf);
  if(texto.includes("�")) texto = new TextDecoder("windows-1252").decode(buf);
  return importarTexto(file.name, texto);
}
function importarTexto(nome, texto){
  const ehOFX = /\.ofx$/i.test(nome) || /<OFX>/i.test(texto);
  const itens = ehOFX ? lerOFX(texto) : lerCSV(texto);
  // período do extrato: linha "Período ... dd/mm/aaaa a dd/mm/aaaa" (Santander e outros) ou datas dos lançamentos
  let de = null, ate = null;
  const mp = texto.match(/per[ií]odo[^\n]*?(\d{2}\/\d{2}\/\d{4})\s*(?:a|at[eé]|-)\s*(\d{2}\/\d{2}\/\d{4})/i);
  if(mp){ de = dataBR(mp[1]); ate = dataBR(mp[2]); }
  else if(ehOFX){ const s = texto.match(/<DTSTART>(\d{8})/i), f = texto.match(/<DTEND>(\d{8})/i); if(s&&f){ de=dataBR(s[1]); ate=dataBR(f[1]); } }
  if(!de && itens.length){ const ds = itens.map(i=>i.data).sort(); de = ds[0]; ate = ds[ds.length-1]; }
  const vistos={}; let novos=0, saidas=0;
  for(const it of itens){
    if(it.valor >= 0) continue;
    saidas++;
    const k = [it.data, Math.round(it.valor*100), norm(it.desc)].join("|");
    vistos[k] = (vistos[k]||0)+1;
    const id = hash(it.fitid ? "f|"+it.fitid : k+"|"+vistos[k]);
    if(!E.lanc[id]){ E.lanc[id] = {id, data:it.data, valor:Math.round(-it.valor*100)/100, desc:it.desc}; novos++; }
  }
  if(itens.length){
    E.envios = (E.envios||[]).concat({quando:new Date().toISOString(), arquivo:nome, de, ate, novos}).slice(-30);
  }
  return {lidos:itens.length, saidas, novos, de, ate};
}

/* ---------- categorias ---------- */
function nomeDe(desc){
  for(let x of String(desc).split(" - ")){
    x = x.trim().replace(/^\d{2}\/\d{2}\s+/,"");
    const n = norm(x);
    if(!n || x.includes("•") || !/[a-z]{3}/.test(n)) continue;
    if(/pix enviado|pix recebido|transferencia enviada|debito visa|debito elo|debito master|compra no|compra com cartao|agencia|conta /.test(n)) continue;
    return x;
  }
  return String(desc).slice(0,50);
}
function ordemCats(){ return [FORA, "farmacia", "comida_fora", "mercado", ...E.metas.map(m=>m.id).filter(id=>!["farmacia","comida_fora","mercado"].includes(id))]; }
function categoria(l){
  if(E.manual[l.id]) return {cat:E.manual[l.id], por:"você escolheu"};
  const d = norm(l.desc);
  for(const [nome,cat] of Object.entries(E.nomes)) if(nome && d.includes(nome)) return {cat, por:"regra do nome"};
  for(const cat of ordemCats()){
    for(const p of (E.palavras[cat]||[])){
      const np = norm(p); if(np && new RegExp("\\b"+reEsc(np)+"\\b").test(d)) return {cat, por:`palavra “${p}”`};
    }
  }
  return {cat:null, por:""};
}
const nomeCat = id => id===FORA ? "Fora do orçamento" : (E.metas.find(m=>m.id===id)?.nome || "Sem categoria");
function opcoes(sel){
  return `<option value="" ${!sel?"selected":""}>— escolher —</option>` +
    E.metas.map(m=>`<option value="${esc(m.id)}" ${sel===m.id?"selected":""}>${esc(m.nome)}</option>`).join("") +
    `<option value="${FORA}" ${sel===FORA?"selected":""}>Excluir (fora do orçamento)</option>`;
}
function classificar(id, cat){
  const l = E.lanc[id]; if(!l) return;
  const nome = nomeDe(l.desc), nn = norm(nome);
  const iguais = Object.values(E.lanc).filter(x => norm(x.desc).includes(nn)).length;
  const rotulo = cat ? nomeCat(cat) : "sem categoria";
  const sempre = nn.length >= 3 && confirm(`Sempre que aparecer “${nome}”, usar “${rotulo}”?\n\nOK = sempre (${iguais} gasto${iguais>1?"s":""} agora e os próximos)\nCancelar = só este gasto`);
  if(sempre){
    if(cat) E.nomes[nn] = cat; else delete E.nomes[nn];
    for(const x of Object.values(E.lanc)) if(norm(x.desc).includes(nn)) delete E.manual[x.id];
  }else{
    if(cat) E.manual[id] = cat; else delete E.manual[id];
  }
  salvar(); render();
  aviso(sempre ? `Regra salva: “${nome}” → ${rotulo}` : `Gasto movido para ${rotulo}`);
}

/* ---------- tela ---------- */
function mesesDisponiveis(){
  const hoje = new Date().toISOString().slice(0,7);
  return [...new Set([hoje, ...Object.values(E.lanc).map(l=>l.data.slice(0,7))])].sort().reverse();
}
function render(){
  const meses = mesesDisponiveis();
  if(!mesAtual || !meses.includes(mesAtual)) mesAtual = meses[0];
  $("#mes").innerHTML = meses.map(m=>{const [a,b]=m.split("-");return `<option value="${m}" ${m===mesAtual?"selected":""}>${MESES[+b-1]} ${a}</option>`}).join("");
  const [ano, mm] = mesAtual.split("-").map(Number);
  $("#titulo").textContent = "Gastos de " + MESES[mm-1];

  const doMes = Object.values(E.lanc).filter(l=>l.data.startsWith(mesAtual)).map(l=>({...l, ...categoria(l)}))
                  .sort((a,b)=> b.data.localeCompare(a.data) || b.valor-a.valor);
  const total = Object.keys(E.lanc).length;
  const ult = (E.envios||[]).slice(-1)[0];
  const ultData = Object.values(E.lanc).map(l=>l.data).sort().pop();
  $("#info").innerHTML = !total ? "" :
    (ult ? `<span>Último extrato enviado: <b>${esc(fmtQuando(ult.quando))}</b></span>
            <span>Período do extrato: <b>${fmtDia(ult.de)} a ${fmtDia(ult.ate)}</b></span>`
         : `<span>Dados até <b>${fmtDia(ultData)}</b></span>`) +
    `<span>Última atualização: <b>${esc(fmtQuando(E.atualizado))}</b></span>`;
  if(!total){
    $("#resumo").textContent = "";
    $("#corpo").innerHTML = `<div class="caixa vazio"><b>Comece subindo o extrato do banco</b>
      Baixe o extrato em CSV ou OFX no site do banco e clique em “Subir extrato” (ou arraste o arquivo para esta página).<br>
      O arquivo é lido aqui no seu navegador. Nada é enviado para a internet.</div>`;
    return;
  }

  const hoje = new Date();
  const diasMes = new Date(ano, mm, 0).getDate();
  const diaRef = (ano===hoje.getFullYear() && mm===hoje.getMonth()+1) ? hoje.getDate() : diasMes;
  const ritmo = diaRef / diasMes;
  const soma = cat => doMes.filter(l=>l.cat===cat).reduce((s,l)=>s+l.valor,0);
  const totG = E.metas.reduce((s,m)=>s+soma(m.id),0), totL = E.metas.reduce((s,m)=>s+(+m.limite||0),0);
  $("#resumo").innerHTML = `Dia ${diaRef} de ${diasMes} · gasto <span class="total">${brl(totG)}</span> de ${brl(totL)} · sobra ${brl(totL-totG)}`;

  const cards = E.metas.map(m=>{
    const g = soma(m.id), lim = +m.limite||0, pct = lim? g/lim : 0, resta = lim-g;
    const [cor, st] = pct>=1 ? ["var(--ruim)","Estourou"] : pct>ritmo+0.10 ? ["var(--alerta)","Acima do ritmo"] : ["var(--bom)","No ritmo"];
    const diasRest = diasMes - diaRef + (diaRef===diasMes?0:1);
    const porDia = resta>0 && diaRef<diasMes ? `≈ ${brl(resta/diasRest)}/dia até o fim do mês` : "";
    return `<section class="card ${filtro===m.id?"sel":""}" data-filtro="${esc(m.id)}">
      <div class="topo"><h2>${esc(m.nome)}</h2><span class="tag" style="color:${cor};border-color:${cor}">${st}</span></div>
      <div class="num">${brl(g)} <small>de ${brl(lim)}</small></div>
      <div class="barra"><div class="enche" style="width:${Math.min(pct,1)*100}%;background:${cor}"></div><div class="ritmo" style="left:${ritmo*100}%"></div></div>
      <div class="rodape"><span>${resta>=0?"Sobram":"Passou"} <b>${brl(Math.abs(resta))}</b></span><span>${porDia}</span></div></section>`;
  }).join("");

  const pend = doMes.filter(l=>!l.cat);
  const linha = l => `<div class="item ${!l.cat?"semcat":""} ${l.cat===FORA?"fora":""}">
      <span class="d">${l.data.slice(8)}/${l.data.slice(5,7)}</span>
      <span class="n"><div title="${esc(l.desc)}">${esc(nomeDe(l.desc))}</div><small>${esc(l.desc.slice(0,60))}${l.por?" · "+esc(l.por):""}</small></span>
      <span class="v">${brl(l.valor)}</span>
      <select data-id="${esc(l.id)}" aria-label="Categoria">${opcoes(l.cat)}</select></div>`;

  const pendHtml = pend.length ? `<section class="caixa pend"><h2>${pend.length} gasto${pend.length>1?"s":""} sem categoria · ${brl(pend.reduce((s,l)=>s+l.valor,0))}</h2>
      <p class="muted">Escolha a categoria de cada um. Para tirar do orçamento (boleto, aluguel, conta já programada), escolha “Excluir”.</p>
      <div class="lista">${pend.map(linha).join("")}</div></section>` : "";

  const contagem = c => doMes.filter(l=> c==="todos" ? true : c==="sem" ? !l.cat : l.cat===c).length;
  const chips = [["todos","Todos"], ...E.metas.map(m=>[m.id,m.nome]), ["sem","Sem categoria"], [FORA,"Excluídos"]]
      .map(([k,t])=>`<button class="chip ${filtro===k?"on":""}" data-filtro="${esc(k)}">${esc(t)} · ${contagem(k)}</button>`).join("");
  const lista = doMes.filter(l=> filtro==="todos" ? true : filtro==="sem" ? !l.cat : l.cat===filtro);

  const hist = mesesDisponiveis().slice(0,6).map(mes=>{
    const ls = Object.values(E.lanc).filter(l=>l.data.startsWith(mes)).map(l=>({...l,...categoria(l)}));
    const [a,b]=mes.split("-");
    return `<tr><td>${MESES[+b-1].slice(0,3)}/${a}</td>${E.metas.map(m=>{const g=ls.filter(l=>l.cat===m.id).reduce((s,l)=>s+l.valor,0);
      return `<td class="vv" style="color:${g>m.limite?"var(--ruim)":"inherit"}">${brl(g)}</td>`}).join("")}</tr>`;
  }).join("");

  $("#corpo").innerHTML = `<div class="grade">${cards}</div>
    <p class="leg">O risco branco na barra mostra onde você “deveria” estar hoje, gastando por igual no mês. Toque num cartão para ver os gastos dele.</p>
    ${pendHtml}
    <h3>Lançamentos do mês</h3>
    <div class="caixa"><div class="filtros">${chips}</div>
      <div class="lista">${lista.map(linha).join("") || '<p class="muted">Nada aqui.</p>'}</div></div>
    <h3>Últimos meses</h3>
    <div class="caixa tab-scroll"><table><tr><th>Mês</th>${E.metas.map(m=>`<th class="vv">${esc(m.nome)}</th>`).join("")}</tr>${hist}</table></div>`;
}

/* ---------- ajustes ---------- */
function renderAjustes(){
  const nomes = Object.entries(E.nomes).sort((a,b)=>a[0].localeCompare(b[0]));
  $("#ajustes").innerHTML = `
    <h3>Metas do mês</h3>
    ${E.metas.map((m,i)=>`<div class="linha-meta"><input data-meta-nome="${i}" value="${esc(m.nome)}" aria-label="Nome">
      <input data-meta-lim="${i}" type="number" min="0" step="50" value="${m.limite}" aria-label="Limite">
      <button class="perigo" data-meta-del="${i}" title="Remover">✕</button></div>`).join("")}
    <button id="addMeta">+ Nova categoria</button>

    <h3>Regras por nome <span class="muted">(${nomes.length})</span></h3>
    ${nomes.length ? nomes.map(([n,c])=>`<div class="linha-nome"><span>${esc(n)}</span>
      <select data-nome="${esc(n)}">${opcoes(c)}</select><button class="perigo" data-nome-del="${esc(n)}" title="Apagar regra">✕</button></div>`).join("")
      : '<p class="muted">Ainda nenhuma. Elas aparecem quando você escolhe “sempre” ao classificar.</p>'}

    <h3>Palavras-chave</h3>
    <p class="muted">Se a descrição do extrato tiver uma destas palavras, o gasto vai sozinho para a categoria. Separe por vírgula.</p>
    ${[...E.metas.map(m=>[m.id,m.nome]), [FORA,"Excluir (fora do orçamento)"]].map(([id,nome])=>`<label>${esc(nome)}</label>
      <textarea data-palavras="${esc(id)}">${esc((E.palavras[id]||[]).join(", "))}</textarea>`).join("")}

    <h3>Backup e dados</h3>
    <p class="muted">Seus dados ficam só neste navegador. Para usar em outro aparelho, baixe o backup aqui e carregue lá. ${Object.keys(E.lanc).length} lançamentos guardados.</p>
    <p class="muted">Proteção contra apagamento automático: ${protegido ? '<b style="color:var(--bom)">ativa</b> (o navegador não apaga sozinho)' : protegido===false ? '<b style="color:var(--alerta)">não concedida</b> — o navegador pode apagar se faltar espaço ou após dias sem uso (Safari). Faça backup de vez em quando.' : "verificando…"}</p>
    ${(E.envios||[]).length ? `<label>Extratos enviados</label><div class="tab-scroll"><table><tr><th>Enviado em</th><th>Período</th><th class="vv">Novos</th></tr>
      ${E.envios.slice().reverse().map(e=>`<tr><td>${esc(fmtQuando(e.quando))}</td><td>${fmtDia(e.de)} a ${fmtDia(e.ate)}</td><td class="vv">${e.novos}</td></tr>`).join("")}</table></div>` : ""}
    <div class="acoes"><button id="bkBaixar">Baixar backup</button><button id="bkCarregar">Carregar backup</button>
      <input type="file" id="bkArq" accept=".json" hidden>
      <button class="perigo" id="apagarMes">Apagar lançamentos do mês</button>
      <button class="perigo" id="apagarTudo">Apagar tudo</button></div>`;
}

/* ---------- eventos ---------- */
$("#btnSubir").onclick = () => $("#arquivo").click();
$("#arquivo").onchange = async e => { await subir([...e.target.files]); e.target.value=""; };
async function subir(files){
  let novos=0, lidos=0;
  for(const f of files){ const r = await lerArquivo(f); novos+=r.novos; lidos+=r.saidas; }
  salvar();
  await protegerDados();
  const datas = Object.values(E.lanc).map(l=>l.data).sort();
  if(novos) mesAtual = datas[datas.length-1].slice(0,7);
  render();
  aviso(lidos ? `${novos} gasto${novos!==1?"s":""} novo${novos!==1?"s":""} (${lidos-novos} já estavam aqui)` : "Não achei gastos nesse arquivo. Use o extrato em CSV ou OFX.");
}
document.addEventListener("dragover", e=>{e.preventDefault();document.body.classList.add("drop");});
document.addEventListener("dragleave", e=>{ if(!e.relatedTarget) document.body.classList.remove("drop");});
document.addEventListener("drop", e=>{e.preventDefault();document.body.classList.remove("drop");if(e.dataTransfer.files.length) subir([...e.dataTransfer.files]);});
$("#mes").onchange = e => { mesAtual = e.target.value; render(); };
$("#corpo").addEventListener("change", e => { const id = e.target.dataset.id; if(id) classificar(id, e.target.value || null); });
$("#corpo").addEventListener("click", e => {
  const f = e.target.closest("[data-filtro]"); if(!f) return;
  filtro = (filtro===f.dataset.filtro && f.classList.contains("card")) ? "todos" : f.dataset.filtro; render();
});
$("#btnAjustes").onclick = () => { renderAjustes(); $("#dlg").showModal(); };
$("#fechar").onclick = () => $("#dlg").close();
$("#dlg").addEventListener("close", render);
$("#ajustes").addEventListener("change", e => {
  const t = e.target, d = t.dataset;
  if(d.metaNome) E.metas[+d.metaNome].nome = t.value.trim() || E.metas[+d.metaNome].nome;
  else if(d.metaLim) E.metas[+d.metaLim].limite = Math.max(0, +t.value||0);
  else if(d.nome !== undefined){ if(t.value) E.nomes[d.nome] = t.value; else delete E.nomes[d.nome]; }
  else if(d.palavras) E.palavras[d.palavras] = t.value.split(",").map(s=>s.trim()).filter(Boolean);
  else if(t.id==="bkArq" && t.files[0]){
    t.files[0].text().then(txt=>{ try{ const s=JSON.parse(txt); if(!s.metas||!s.lanc) throw 0;
      if(confirm("Substituir os dados deste navegador pelos do backup?")){ E = Object.assign(structuredClone(PADRAO), s); salvar(); renderAjustes(); aviso("Backup carregado"); } }
      catch(err){ aviso("Esse arquivo não é um backup válido."); } });
    return;
  }
  salvar();
});
$("#ajustes").addEventListener("click", e => {
  const t = e.target, d = t.dataset;
  if(d.metaDel){ const m = E.metas[+d.metaDel];
    if(confirm(`Remover a categoria “${m.nome}”? Os gastos dela voltam para “sem categoria”.`)){
      E.metas.splice(+d.metaDel,1);
      for(const k in E.manual) if(E.manual[k]===m.id) delete E.manual[k];
      for(const k in E.nomes) if(E.nomes[k]===m.id) delete E.nomes[k];
      delete E.palavras[m.id];
    } }
  else if(t.id==="addMeta"){ const nome = prompt("Nome da nova categoria:"); if(!nome) return;
    const lim = +prompt("Limite por mês (R$):","500") || 0; let id = slug(nome); while(E.metas.some(m=>m.id===id) || id===FORA) id += "_";
    E.metas.push({id, nome:nome.trim(), limite:lim}); E.palavras[id] = []; }
  else if(d.nomeDel){ delete E.nomes[d.nomeDel]; }
  else if(t.id==="bkBaixar"){
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(E,null,1)],{type:"application/json"}));
    a.download = `backup-gastos-${new Date().toISOString().slice(0,10)}.json`; a.click(); return;
  }
  else if(t.id==="bkCarregar"){ $("#bkArq").click(); return; }
  else if(t.id==="apagarMes"){ const [a,b]=mesAtual.split("-"); const ids = Object.values(E.lanc).filter(l=>l.data.startsWith(mesAtual)).map(l=>l.id);
    if(!confirm(`Apagar os ${ids.length} lançamentos de ${MESES[+b-1]} ${a}? Depois é só subir o extrato de novo.`)) return;
    ids.forEach(id=>{delete E.lanc[id]; delete E.manual[id];}); }
  else if(t.id==="apagarTudo"){ if(!confirm("Apagar TODOS os dados deste navegador (lançamentos, regras e metas)? Isso não tem volta.")) return;
    E = structuredClone(PADRAO); }
  else return;
  salvar(); renderAjustes();
});

window.__importarTexto = (n,t)=>{ const r=importarTexto(n,t); salvar(); render(); return r; };
render();
protegerDados();
</script>
</body>
</html>
